name: rc054-windows-client

# RC-054's Windows leg needs a browser on Windows. GitHub's windows-latest
# runner is a real Windows machine, so the journey runs there while the Linux
# host stays the one named by the dispatch input. Dispatched by hand: it is a
# platform proof, not a gate that repeats the sam-harness checks.
on:
  workflow_dispatch:
    inputs:
      backend_origin:
        description: HTTPS origin of the Linux RemoteCode host, e.g. https://34.1.2.3:8443
        required: true
      auth_password:
        description: Passphrase that Linux host was started with
        required: true
      browser:
        description: Chromium engine to run the journey on
        required: false
        type: string
        default: chromium

permissions:
  contents: read

jobs:
  windows-client:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install the dependencies and the Windows browser
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps "${{ inputs.browser }}"

      - name: Run the journey from the Windows browser
        env:
          RC054_BACKEND_ORIGIN: ${{ inputs.backend_origin }}
          RC054_AUTH_PASSWORD: ${{ inputs.auth_password }}
          RC054_BROWSER: ${{ inputs.browser }}
        run: bash scripts/rc054/run-windows-client-proof.sh "$GITHUB_WORKSPACE/proof-rc054-windows"

      - name: Keep the transcript, the Vite log and the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc054-windows-evidence
          path: proof-rc054-windows/
          if-no-files-found: error
