# Generated by sam-harness. Edit .sam-harness/config.yaml, not this file.
# Happy path: check → test → build → deploy → verify → release → monitor
# Exception path: failure → repair / rollback → verify
# Prefer these jobs over host CI that only repeats the same gates.
# GitHub job names remain static/test/e2e/artifact/staging/production/observe; map them onto that graph.
name: sam-harness

on:
  pull_request:
  merge_group:
  push:

permissions:
  contents: read
  actions: read
  pull-requests: read


jobs:
  static:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Run static phase
        id: phase
        run: 'go run github.com/samuelfaj/sam-harness/cmd/sam-harness@v0.10.0 pipeline . --phase static --receipt true'
      - name: Preserve phase receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-static
          if-no-files-found: error
          path: .sam-harness/evidence/

  test:
    runs-on: ubuntu-latest
    needs: static
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
      - name: Run test phase
        id: phase
        run: 'go run github.com/samuelfaj/sam-harness/cmd/sam-harness@v0.10.0 pipeline . --phase test --receipt true'
      - name: Preserve phase receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-harness-receipts-test
          if-no-files-found: error
          path: .sam-harness/evidence/
