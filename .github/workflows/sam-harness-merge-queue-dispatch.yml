# Generated by sam-harness
name: sam-harness merge-queue dispatch
on:
  merge_group:
jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Forward merge-group review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='sam_harness_merge_group_review' \
            -f client_payload[head_sha]='${{ github.sha }}' \
            -f client_payload[base_sha]='${{ github.event.merge_group.base_sha }}' \
            -f client_payload[merge_group_ref]='${{ github.ref }}'
